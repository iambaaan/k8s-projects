```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ic-deploy-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ic-devops
  template:
    metadata:
      labels:
        app: ic-devops
    spec:
      initContainers:
        - name: ic-msg-devops
          image: ubuntu:latest
          command:
            - "/bin/bash"
            - "-c"
            - "echo Init Done - Welcome to xFusionCorp Industries > /ic/blog"
          volumeMounts:
            - name: ic-volume-devops
              mountPath: /ic

      containers:
        - name: ic-main-devops
          image: ubuntu:latest
          command:
            - "/bin/bash"
            - "-c"
            - "while true; do cat /ic/blog; sleep 5; done"
          volumeMounts:
            - name: ic-volume-devops
              mountPath: /ic

      volumes:
        - name: ic-volume-devops
          emptyDir: {}
```
