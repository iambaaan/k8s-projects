apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node
  template:
    metadata:
      labels:
        app: node 
    spec:
      containers:
      - name: node-container
        image: kodekloud/centos-ssh-enabled:node
        ports:
        - containerPort: 8080
---

apiVersion: v1
kind: Service
metadata:
  name: node-service
spec:
  type: NodePort
  selector:
    app: node
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30012

