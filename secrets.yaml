apiVersion: v1
kind: Pod
metadata:
  name: secret-devops
  
spec:
  containers:
  - name:  secret-container-devops
    image: fedora:latest 
    command:
      - sleep
      - "3600"
    volumeMounts:
      - name: secret-volume
        mountPath: /opt/demo
        ReadOnly: true


  volumes:
    - name: secret-volume
      secret:
        secretName: media