# 1. PersistentVolume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-nautilus
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/security

---

# 2. PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-nautilus
spec:
  storageClassName: manual
  resources:
    requests:
      storage: 2Gi
  accessModes:
    - ReadWriteOnce

---

# 3. Pod
apiVersion: v1
kind: Pod
metadata:
  name: pod-nautilus
  labels:
    app: nautilus
spec:
  containers:
    - name: container-nautilus
      image: httpd:latest
      volumeMounts:
        - name: pod-volume
          mountPath: /usr/local/apache2/htdocs

  volumes:
    - name: pod-volume
      persistentVolumeClaim:
        claimName: pvc-nautilus

---

# 4. Service
apiVersion: v1
kind: Service
metadata:
  name: web-nautilus
spec:
  type: NodePort
  selector:
    app: nautilus
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30008