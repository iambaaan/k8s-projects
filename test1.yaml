apiVersion: v1
kind: namespace
metadata:
  name: httpd-namespace-devops


---


apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-deployment-devops
  namespace: httpd-deployment-devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: httpd
  template:
    metadata:
      labels:
        app: httpd
    spec:
      containers:
      - name: httpd-container
        image: httpd:latest
        ports:
        - containerPort: 80


---


apiVersion: v1
kind: Service
metadata:  
  name: httpd-service-devops
  namespace: httpd-namespace-devops
spec:
  type: NodePort
  selector:
    app: httpd
  ports:
  - port: 8080
    targetPort: 80
    NodePort: 30004
